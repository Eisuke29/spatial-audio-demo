<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聴覚リダイレクション デモ</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--p:#10b981;--snd:#a855f7;
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 8px 0 0}
.sp{flex:1}
.muted{color:var(--muted);font-size:12px}
.btn{border:0;border-radius:8px;padding:6px 11px;font:inherit;font-weight:700;cursor:pointer;background:#eef2ff;color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff}
.seg{display:flex;background:#f1f5f9;border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font:inherit;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0002}
.app{flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr;gap:12px;padding:12px}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.side.off{opacity:.4;pointer-events:none}
.card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 2px #0000000d}
.lbl{font-size:12px;font-weight:700;margin:0 0 6px}
table.ctab{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}
.ctab th{font-weight:600;color:var(--muted);text-align:left;font-size:11px}
.ctab thead th{text-align:center}
.ctab td{padding:0}
.ctab button{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font:inherit;font-size:15px;cursor:pointer}
.ctab button[aria-pressed=true]{border-color:var(--accent);background:#eef2ff;color:#3730a3;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 10px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.prog{height:6px;background:#eef2ff;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage{position:relative;padding:0;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.steps{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.steps span{font-size:12px;padding:3px 10px;border-radius:99px;background:#f1f5f9;color:#9ca3af}
.steps span.now{background:var(--accent);color:#fff;font-weight:700}
.steps .info{margin-left:auto;background:none;color:var(--muted);padding:0}
canvas{display:block;width:100%;flex:1;min-height:0;background:#fff;cursor:pointer}
.banner{position:absolute;left:0;right:0;top:40px;bottom:0;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:2px;pointer-events:none;text-align:center}
.banner big{font-size:clamp(18px,2.2vw,26px);font-weight:800;background:#ffffffe6;padding:0 12px;border-radius:10px}
.banner small{font-size:13px;color:var(--muted);background:#ffffffe6;padding:0 10px;border-radius:8px}
.banner.dark{background:#0b0d12;justify-content:center;padding-top:0}
.banner.dark big{background:none;color:#e5e7eb}.banner.dark small{background:none;color:#9ca3af}
.res{position:absolute;left:12px;bottom:12px;background:#fffffff2;border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px #0001;max-width:360px}
.res .big{font-size:30px;font-weight:800;line-height:1.1}
.res .big small{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.res p{margin:4px 0 0}
dialog{border:0;border-radius:14px;padding:18px;max-width:min(900px,95vw);box-shadow:0 20px 60px #0003}
dialog::backdrop{background:#0006}
table.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:600;color:var(--muted);text-align:center;padding:2px 6px}
.heat th:first-child{text-align:left;white-space:nowrap}
.heat td{text-align:center;border-radius:6px;padding:4px 8px;min-width:60px}
.heat td b{display:block;font-size:13px}
.heat td span{font-size:10px;opacity:.85}
</style>
</head>
<body>
<header>
  <h1>🎧 聴覚リダイレクション</h1>
  <div class="seg" id="mode"><button data-v="auto">自動</button><button data-v="manual">手動</button></div>
  <span class="sp"></span>
  <span class="muted" id="warn"></span>
  <button class="btn" id="tl">◀ 左</button><button class="btn" id="tr">右 ▶</button>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.6" style="width:80px" title="音量">
  <button class="btn" id="sumBtn">まとめ</button>
  <button class="btn" id="redo">覚え直す</button>
</header>

<div class="app">
  <aside class="side" id="side">
    <div class="card">
      <div class="lbl" id="condLbl">音の条件</div>
      <table class="ctab">
        <thead><tr><th></th><th>鳴りっぱなし</th><th>バックセンサー</th></tr></thead>
        <tbody id="ctab"></tbody>
      </table>
      <div class="muted" id="condName" style="margin-top:4px;min-height:1.5em"></div>
    </div>
    <div class="card">
      <div class="lbl" id="angLbl">道具の間隔</div>
      <div class="chips" id="angChips"></div>
    </div>
    <div class="card" id="manualBox">
      <div class="lbl">取る道具</div>
      <div class="seg" id="toolSeg"><button data-v="A">赤 左</button><button data-v="M">青 中</button><button data-v="B">黄 右</button><button data-v="rand">🎲</button></div>
    </div>
    <div class="card" id="autoBox">
      <div class="row"><span class="lbl" style="margin:0">進み具合</span><button class="btn" id="restart">最初から</button></div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="muted" id="progTxt"></div>
    </div>
  </aside>

  <section class="card stage">
    <div class="steps" id="steps"><span>位置合わせ</span><span>覚える</span><span>声</span><span>伸ばす</span><span>答える</span><span class="info" id="trialInfo"></span></div>
    <canvas id="cv"></canvas>
    <div class="banner" id="banner"><big id="bBig"></big><small id="bSmall"></small></div>
    <div class="res" id="res" hidden>
      <div class="big" id="rBig"></div>
      <p id="rTxt"></p>
      <div id="finalBox" hidden style="margin-top:8px"><b>本物はいくつあった？</b>
        <button class="btn" data-real="1">1</button><button class="btn" data-real="2">2</button><button class="btn" data-real="3">3</button> <span class="muted" id="realAns"></span></div>
    </div>
  </section>
</div>

<dialog id="sumDlg">
  <div class="row" style="margin-bottom:8px"><b>まとめ（本物Pへ引っぱられた割合）</b><span><button class="btn" id="clearAll">消す</button> <button class="btn pri" id="sumClose">閉じる</button></span></div>
  <table class="heat" id="heat"></table>
  <p class="muted" style="margin:8px 0 0">0%＝覚えた道具の場所、100%＝本物P。小さい数字＝「ずれていた」／回答数。青（本物と同じ場所）は、本物からの距離（スタート→本物＝100）。途中で止めた回は入れない。</p>
</dialog>

<script>
(() => {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ===== 道具と条件 =====
const TOOLS = { A: { name: '赤', side: -1, color: '#ef4444', pos: '左' }, M: { name: '青', side: 0, color: '#2563eb', pos: '真ん中' }, B: { name: '黄', side: 1, color: '#d97706', pos: '右' } };
const CONDS = [
  { id: 'none', loc: null, type: null, name: '音なし', mark: '−' },
  { id: 'T-c', loc: 'T', type: 'c', name: '道具の場所 × 鳴りっぱなし', mark: '○' },
  { id: 'T-s', loc: 'T', type: 's', name: '道具の場所 × バックセンサー', mark: '×' },
  { id: 'P-c', loc: 'P', type: 'c', name: '本物の場所 × 鳴りっぱなし', mark: '△' },
  { id: 'P-s', loc: 'P', type: 's', name: '本物の場所 × バックセンサー', mark: '◎' },
  { id: 'W-c', loc: 'W', type: 'c', name: 'ワーピング × 鳴りっぱなし', mark: '◎' },
  { id: 'W-s', loc: 'W', type: 's', name: 'ワーピング × バックセンサー', mark: '○' },
];
const CMAP = Object.fromEntries(CONDS.map(c => [c.id, c]));
const ANGLES = [5, 10, 15, 20, 30, 40];
const ARM_CM = 45; // 音の距離感用：スタート→Pを約45cmとみなす

let set = Object.assign({ mode: 'auto', conds: CONDS.map(c => c.id), angles: [10, 20, 30], mCond: 'W-c', mAng: 20, mTool: 'rand' }, store.get('ar4.set', {}));
let learned = store.get('ar4.learned', null);
let plan = store.get('ar4.plan', null);
let history = store.get('ar4.history', []);
function save() { store.set('ar4.set', set); store.set('ar4.learned', learned); store.set('ar4.plan', plan); store.set('ar4.history', history); }

// ===== 左パネル =====
const ctab = $('ctab');
[['道具', 'T'], ['本物', 'P'], ['ワーピング', 'W']].forEach(([lab, loc]) => {
  const tr = document.createElement('tr'); tr.innerHTML = `<th>${lab}</th>`;
  ['c', 's'].forEach(type => { const c = CONDS.find(x => x.loc === loc && x.type === type); tr.insertAdjacentHTML('beforeend', `<td><button data-c="${c.id}" title="${c.name}">${c.mark}</button></td>`); });
  ctab.appendChild(tr);
});
ctab.insertAdjacentHTML('beforeend', `<tr><th>音なし</th><td colspan="2"><button data-c="none" title="音なし">−</button></td></tr>`);
ctab.querySelectorAll('button').forEach(b => {
  b.onmouseenter = () => { $('condName').textContent = CMAP[b.dataset.c].name; };
  b.onmouseleave = () => { $('condName').textContent = ''; };
  b.onclick = () => {
    if (busy()) return; const id = b.dataset.c;
    if (set.mode === 'manual') set.mCond = id;
    else { const s = new Set(set.conds); s.has(id) ? s.delete(id) : s.add(id); if (!s.size) return; set.conds = CONDS.map(c => c.id).filter(x => s.has(x)); plan = null; }
    save(); sync(); render();
  };
});
ANGLES.forEach(a => { const b = document.createElement('button'); b.className = 'chip'; b.dataset.a = a; b.textContent = a + '°';
  b.onclick = () => { if (busy()) return;
    if (set.mode === 'manual') set.mAng = a;
    else { const s = new Set(set.angles); s.has(a) ? s.delete(a) : s.add(a); if (!s.size) return; set.angles = ANGLES.filter(x => s.has(x)); plan = null; }
    save(); sync(); render(); };
  $('angChips').appendChild(b); });
$('mode').querySelectorAll('button').forEach(b => b.onclick = () => { if (busy()) return; set.mode = b.dataset.v; save(); sync(); render(); });
$('toolSeg').querySelectorAll('button').forEach(b => b.onclick = () => { if (busy()) return; set.mTool = b.dataset.v; save(); sync(); render(); });
$('restart').onclick = () => { if (busy()) return; plan = null; save(); sync(); render(); };
$('redo').onclick = () => { if (busy()) return; learned = null; save(); render(); };
$('vol').oninput = () => { if (master) master.gain.value = Number($('vol').value); };
$('sumBtn').onclick = () => { renderHeat(); $('sumDlg').showModal(); };
$('sumClose').onclick = () => $('sumDlg').close();
$('clearAll').onclick = () => { if (confirm('結果を消しますか？')) { history = []; save(); renderHeat(); } };
document.querySelectorAll('[data-real]').forEach(b => b.onclick = () => { if (plan) { plan.real = Number(b.dataset.real); save(); $('realAns').textContent = `→ 本当は1つ`; } });

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makePlan() {
  const blocks = shuffle([...set.angles]).map(ang => ({ ang, trials: shuffle(set.conds.flatMap(cond => ['A', 'M', 'B'].map(tool => ({ cond, tool })))) }));
  return { blocks, b: 0, i: 0, real: null };
}
const planDone = () => plan && plan.b >= plan.blocks.length;
function planCount() { let d = 0, n = 0; plan.blocks.forEach((bl, k) => { n += bl.trials.length; if (k < plan.b) d += bl.trials.length; else if (k === plan.b) d += plan.i; }); return [d, n]; }
function nextSpec() {
  if (set.mode === 'manual') return { ang: set.mAng, cond: set.mCond, tool: set.mTool };
  if (!plan) plan = makePlan();
  if (planDone()) return null;
  const bl = plan.blocks[plan.b]; return { ang: bl.ang, ...bl.trials[plan.i] };
}
function sync() {
  const auto = set.mode === 'auto';
  $('mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === set.mode)));
  $('autoBox').hidden = !auto; $('manualBox').hidden = auto;
  $('condLbl').textContent = auto ? '音の条件（使うもの全部）' : '音の条件（1つ）';
  $('angLbl').textContent = auto ? '道具の間隔（使うもの全部）' : '道具の間隔（1つ）';
  ctab.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(auto ? set.conds.includes(b.dataset.c) : set.mCond === b.dataset.c)));
  $('angChips').querySelectorAll('.chip').forEach(b => { const a = Number(b.dataset.a); b.setAttribute('aria-pressed', String(auto ? set.angles.includes(a) : set.mAng === a)); });
  $('toolSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === set.mTool)));
  if (auto && !plan) { plan = makePlan(); save(); }
  if (plan) { const [d, n] = planCount(); $('progBar').style.width = (d / n * 100) + '%'; $('progTxt').textContent = planDone() ? `${n}回 終了` : `${d} / ${n}回（間隔 ${plan.blocks[plan.b].ang}°）`; }
  $('side').classList.toggle('off', busy());
}

// ===== 音 =====
let ac = null, master = null, panner = null, burst = null;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = Number($('vol').value); master.connect(ac.destination);
  panner = ac.createPanner(); panner.panningModel = 'HRTF'; panner.distanceModel = 'inverse'; panner.refDistance = 0.3; panner.rolloffFactor = 1;
  panner.connect(master);
  const l = ac.listener;
  if (l.forwardX) { l.forwardX.value = 0; l.forwardY.value = 0; l.forwardZ.value = -1; l.upX.value = 0; l.upY.value = 1; l.upZ.value = 0; } else l.setOrientation(0, 0, -1, 0, 1, 0);
  const sr = ac.sampleRate, n = Math.floor(sr * 0.15), f = Math.floor(sr * 0.005);
  burst = ac.createBuffer(1, n, sr); const d = burst.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, i / f, (n - 1 - i) / f) * 0.5;
}
const HEAD_BEHIND = 20, EAR_ABOVE = 30; // 耳はスタート印の20cm後ろ・30cm上と仮定（cm）
function setSource(p) { // p は「スタート→P = 1」の単位
  const x = p.x * ARM_CM / 100, y = -EAR_ABOVE / 100, z = -(p.y * ARM_CM + HEAD_BEHIND) / 100, t = ac.currentTime;
  if (panner.positionX) { panner.positionX.setTargetAtTime(x, t, 0.01); panner.positionY.setTargetAtTime(y, t, 0.01); panner.positionZ.setTargetAtTime(z, t, 0.01); }
  else panner.setPosition(x, y, z);
}
function pulse(t, gain, dest) { const s = ac.createBufferSource(); s.buffer = burst; const g = ac.createGain(); g.gain.value = gain; s.connect(g); g.connect(dest); s.start(t); }
function beep() { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.frequency.value = 1000;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.12); }
function testSide(s) { ensureAudio(); const p = ac.createStereoPanner(); p.pan.value = s; p.connect(master); for (let i = 0; i < 3; i++) pulse(ac.currentTime + i * 0.25, 0.8, p); }
$('tl').onclick = () => testSide(-1); $('tr').onclick = () => testSide(1);
function speak(text, done) {
  let fired = false; const go = () => { if (!fired) { fired = true; done(); } };
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 1.1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja')); if (v) u.voice = v;
    u.onend = go; u.onerror = go; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
  later(go, 2500);
}
let schedTimer = null, nextT = 0;
function startLoop() {
  stopLoop(); nextT = ac.currentTime + 0.03;
  const tick = () => { const st = soundNow(); if (!st) return; setSource(st.pos);
    while (nextT < ac.currentTime + 0.08) { pulse(nextT, st.gain, panner); nextT += st.interval; }
    schedTimer = setTimeout(tick, 20); };
  tick();
}
function stopLoop() { clearTimeout(schedTimer); schedTimer = null; }
// 鳴る場所：取る道具T・本物P・ワーピング（手の進み具合でT→P）
function srcPos() {
  const c = CMAP[trial.cond], { T, P } = trial;
  if (c.loc === 'T') return T;
  if (c.loc === 'P') return P;
  if (c.loc === 'W') { const q = clamp(hand.y, 0, 1), s = q * q * (3 - 2 * q); return { x: T.x + (P.x - T.x) * s, y: T.y + (P.y - T.y) * s }; }
  return null;
}
// 鳴り方：鳴りっぱなし（一定）・バックセンサー（鳴る場所に近いほど速く大きく）
function soundNow() {
  if (!trial || state !== 'reach') return null;
  const c = CMAP[trial.cond]; if (!c.loc) return null;
  const pos = srcPos();
  if (c.type === 'c') return { pos, interval: 0.35, gain: 0.8 };
  const k = clamp(1 - Math.hypot(hand.x - pos.x, hand.y - pos.y) / 0.7, 0, 1);
  return { pos, interval: 0.6 - 0.5 * k, gain: 0.3 + 0.7 * k };
}

// ===== 状態とマウス =====
// 座標：毎回はかる「スタートS → 本物P」を基準にする。
//   y = Pへ向かう方向（Sで0、Pで1）、x = それに直角な右方向（同じ物差し）。
//   マウスの向きが少し回っていても、Pの方向を「前」とみなすので、ずれない。
// 1回の流れ（固定中）：calP（本物に触れてクリック）→ calS（スタートに戻してクリック）
//   → [覚える：learnGo ⇄ learnBack → calP に戻る] → instruct（声）→ reach → answer
const cv = $('cv'), ctx = cv.getContext('2d');
let state = 'idle', trial = null, last = null, timers = [], note = '';
let raw = { x: 0, y: 0 }, rawP = null, frame = null, hand = { x: 0, y: 0 };
let learnSeq = [], learnK = 0, learnAng = null, accel = false;
const LOCKED = ['calP', 'calS', 'learnGo', 'learnBack', 'instruct', 'reach', 'answer'];
const busy = () => LOCKED.includes(state);
const locked = () => document.pointerLockElement === cv;
const P0 = { x: 0, y: 1 };
const rot = (p, d) => { const r = d * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return { x: p.x * c + p.y * s, y: -p.x * s + p.y * c }; };
const geom = ang => ({ P: P0, A: rot(P0, -ang), M: { ...P0 }, B: rot(P0, ang) }); // 道具はSから同じ距離の弧の上。Pから左右に ang°
const touchR = ang => Math.min(0.08, 0.9 * Math.sin(ang * Math.PI / 360));
// マウスの生の位置 → S・P基準の座標
function toFrame(r) {
  const dx = r.x - frame.S.x, dy = r.y - frame.S.y;
  return { x: (dx * frame.v.x + dy * frame.v.y) / frame.len, y: (dx * frame.u.x + dy * frame.u.y) / frame.len };
}
function makeFrame(S, P) {
  const vx = P.x - S.x, vy = P.y - S.y, len = Math.hypot(vx, vy), u = { x: vx / len, y: vy / len };
  return { S, len, u, v: { x: u.y, y: -u.x } }; // v = u を右に90°回したもの
}
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function later(f, ms) { timers.push(setTimeout(f, ms)); }
function lock() { ensureAudio();
  try { const r = cv.requestPointerLock({ unadjustedMovement: true });
    if (r && r.catch) r.catch(() => { accel = true; try { cv.requestPointerLock(); } catch {} }); }
  catch { accel = true; cv.requestPointerLock(); } }
function unlock() { if (document.pointerLockElement) document.exitPointerLock(); }

let lockedAt = 0;
document.addEventListener('pointerlockerror', () => { note = '固定できませんでした。1秒待ってもう一度クリック'; render(); });
document.addEventListener('pointerlockchange', () => {
  if (locked()) {
    lockedAt = performance.now(); raw = { x: 0, y: 0 }; rawP = null; frame = null;
    $('warn').textContent = accel ? '⚠ マウス加速が切れていません（距離がずれます）' : '';
    const sp = nextSpec(); if (!sp) { unlock(); return; }
    learnAng = sp.ang; state = 'calP'; note = '';
  } else if (busy()) { stopLoop(); clearTimers(); trial = null; state = 'idle'; note = ''; }
  sync(); render();
});
cv.addEventListener('click', () => { if (!locked() && !busy() && state !== 'done') lock(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('contextmenu', e => { if (locked()) e.preventDefault(); });

document.addEventListener('mousemove', e => {
  if (!locked()) return;
  raw.x += e.movementX; raw.y -= e.movementY;
  if (!frame) { draw(); return; }
  hand = toFrame(raw);
  if (state === 'learnGo') { const id = learnSeq[learnK], p = geom(learnAng)[id];
    if (Math.hypot(hand.x - p.x, hand.y - p.y) < touchR(learnAng)) { setSource(p); for (let i = 0; i < 2; i++) pulse(ac.currentTime + i * 0.18, 0.8, panner); state = 'learnBack'; render(); return; } }
  else if (state === 'learnBack' && Math.hypot(hand.x, hand.y) < 0.08) {
    learnK++; if (learnK < learnSeq.length) { state = 'learnGo'; render(); return; }
    learned = learnAng; save(); frame = null; rawP = null; state = 'calP'; note = '覚えました'; render(); return; }
  else if (state === 'reach') { trial.path.push({ ...hand }); const s = srcPos(); if (s) trial.src.push({ ...s }); return; }
  draw();
});
document.addEventListener('mousedown', e => {
  if (!locked() || performance.now() - lockedAt < 200) return;
  if (e.button === 2 && ['calP', 'calS', 'learnGo', 'learnBack'].includes(state)) { state = 'idle'; unlock(); return; }
  if (e.button === 0 && state === 'calP') { rawP = { ...raw }; state = 'calS'; note = ''; render(); return; }
  if (e.button === 0 && state === 'calS') {
    const d = Math.hypot(rawP.x - raw.x, rawP.y - raw.y);
    if (d < 50) { note = '本物とスタートが近すぎます。本物に触れるところからやり直し'; state = 'calP'; render(); return; }
    frame = makeFrame({ ...raw }, rawP); hand = { x: 0, y: 0 }; store.set('ar5.len', d);
    if (learned !== learnAng) { learnSeq = ['A', 'M', 'B', 'A', 'M', 'B']; learnK = 0; state = 'learnGo'; render(); return; }
    startTrial(); return;
  }
  if (state === 'reach') { endReach(); return; }
  if (state === 'answer') { answer(e.button === 0 ? 'yes' : e.button === 2 ? 'no' : 'unsure'); return; }
});
document.addEventListener('keydown', e => { if (state === 'answer' && e.code === 'Digit3') answer('unsure'); });

function startTrial() {
  const sp = nextSpec(); if (!sp) return;
  ensureAudio(); clearTimers();
  const tool = sp.tool === 'rand' ? ['A', 'M', 'B'][Math.floor(Math.random() * 3)] : sp.tool, g = geom(sp.ang);
  trial = { cond: sp.cond, ang: sp.ang, tool, P: g.P, T: g[tool], path: [{ ...hand }], src: [] };
  state = 'instruct'; render();
  later(() => speak(`${TOOLS[tool].name}を取って`, () => {
    if (state !== 'instruct') return;
    trial.start = { ...hand }; trial.path = [{ ...hand }]; state = 'reach'; trial.t0 = performance.now(); beep(); later(startLoop, 120); render();
  }), 400);
}
function endReach() { stopLoop(); clearTimers(); trial.E = { ...hand }; trial.ms = performance.now() - trial.t0; state = 'answer'; render(); }
// 位置で計算する（角度は使わない）
//   引っぱり = 止めた位置E を「道具T→本物P」の線に投影した割合（T=0、P=1）
//   届いた深さ = E の前方向の成分（S=0、P=1）。0.6未満は「途中で止めた」
function answer(v) {
  const t = trial; t.noticed = v;
  const dx = t.P.x - t.T.x, dy = t.P.y - t.T.y, L2 = dx * dx + dy * dy;
  t.pull = L2 > 1e-9 ? ((t.E.x - t.T.x) * dx + (t.E.y - t.T.y) * dy) / L2 : null;
  t.depth = t.E.y;
  t.errT = Math.hypot(t.E.x - t.T.x, t.E.y - t.T.y);
  t.errP = Math.hypot(t.E.x - t.P.x, t.E.y - t.P.y);
  t.valid = t.depth >= 0.6;
  history.push({ cond: t.cond, ang: t.ang, tool: t.tool, pull: t.pull, depth: t.depth, errT: t.errT, errP: t.errP, valid: t.valid, noticed: v, ms: Math.round(t.ms), mode: set.mode, time: Date.now() });
  if (set.mode === 'auto' && plan) { plan.i++; if (plan.i >= plan.blocks[plan.b].trials.length) { plan.b++; plan.i = 0; } }
  last = t; trial = null; state = planDone() && set.mode === 'auto' ? 'done' : 'result';
  save(); showResult(); unlock(); sync(); render();
}

// ===== 結果 =====
const pct = v => `${Math.round(v * 100)}`;
function showResult() {
  const t = last, tl = TOOLS[t.tool], ans = { yes: 'ずれていた', no: 'ずれていない', unsure: 'わからない' }[t.noticed];
  if (!t.valid) $('rBig').innerHTML = `途中で止めた<small>本物までの距離の ${pct(t.depth)}% で止めた（まとめに入れない）</small>`;
  else if (t.pull === null) $('rBig').innerHTML = `本物から ${pct(t.errP)}<small>（スタート→本物 を100として）</small>`;
  else $('rBig').innerHTML = `${pct(t.pull)}%<small>本物Pへ引っぱられた</small>`;
  $('rTxt').innerHTML = `${tl.name}（${tl.pos}） ／ ${t.ang}° ／ ${CMAP[t.cond].name}<br>` +
    `止めた位置：${tl.name}から ${pct(t.errT)}、本物から ${pct(t.errP)}（スタート→本物＝100）<br>答え：<b>${ans}</b>` +
    (t.valid && t.pull !== null && t.pull >= 0.7 && t.noticed === 'no' ? '　<b style="color:var(--p)">→ 気づかず本物へ</b>' : '');
  $('res').hidden = false; $('finalBox').hidden = state !== 'done';
}
function renderHeat() {
  const el = $('heat'), hv = history.filter(h => h.valid);
  if (!hv.length) { el.innerHTML = '<tr><td class="muted">まだありません</td></tr>'; return; }
  const angs = [...new Set(hv.map(h => h.ang))].sort((a, b) => a - b);
  const cell = (h, isM) => {
    if (!h.length) return '<td style="background:#f8fafc;color:#cbd5e1">—</td>';
    const ans = h.filter(r => r.noticed !== 'unsure'), yes = ans.filter(r => r.noticed === 'yes').length, sub = `<span>${yes}/${ans.length}</span>`;
    if (isM) return `<td style="background:#f1f5f9"><b>${pct(h.reduce((s, r) => s + r.errP, 0) / h.length)}</b>${sub}</td>`;
    const m = h.reduce((s, r) => s + r.pull, 0) / h.length, k = clamp(m, 0, 1);
    return `<td style="background:rgba(79,70,229,${0.08 + 0.8 * k});color:${k > 0.55 ? '#fff' : 'inherit'}"><b>${pct(m)}%</b>${sub}</td>`;
  };
  el.innerHTML = '<tr><th></th>' + angs.map(a => `<th>赤・黄 ${a}°</th>`).join('') + '<th>青（本物）</th></tr>' +
    CONDS.map(c => { const hc = hv.filter(r => r.cond === c.id);
      return `<tr><th>${c.mark} ${c.name}</th>` + angs.map(a => cell(hc.filter(r => r.ang === a && r.tool !== 'M'), false)).join('') + cell(hc.filter(r => r.tool === 'M'), true) + '</tr>'; }).join('');
}

// ===== 表示 =====
const STEP = { calP: 0, calS: 0, learnGo: 1, learnBack: 1, instruct: 2, reach: 3, answer: 4 };
function specText(sp) { return sp ? `${sp.ang}° ／ ${CMAP[sp.cond].name} ／ ${sp.tool === 'rand' ? '🎲' : TOOLS[sp.tool].name}` : ''; }
function render() {
  const i = STEP[state] ?? -1;
  $('steps').querySelectorAll('span:not(.info)').forEach((s, k) => s.className = k === i ? 'now' : '');
  const sp = nextSpec();
  $('trialInfo').textContent = trial ? '' : sp ? `次：${specText(sp)}` : '';
  const bn = $('banner'), B = $('bBig'), S = $('bSmall');
  bn.classList.toggle('dark', ['instruct', 'reach', 'answer'].includes(state));
  let big = '', small = '';
  if (state === 'idle' || state === 'result') {
    big = !sp ? '終了' : state === 'result' ? 'クリックで次へ' : 'クリックで開始';
    small = state === 'idle' ? '机にスタート印と、その真正面に本物を置く' : '';
  }
  else if (state === 'done') big = '終了';
  else if (state === 'calP') { big = '本物に触れてクリック'; small = note || '毎回、本物とスタートで位置を合わせ直します（右クリック：やめる）'; }
  else if (state === 'calS') { big = 'スタート印に戻してクリック'; small = note || (learned !== learnAng ? `このあと道具の場所を覚えます（${learnAng}°）` : 'このあと声 → 目を閉じて手を伸ばす'); }
  else if (state === 'learnGo') { const id = learnSeq[learnK]; big = `${TOOLS[id].name}（${TOOLS[id].pos}）に触れる`; small = `覚える ${learnK + 1} / ${learnSeq.length}`; }
  else if (state === 'learnBack') { big = 'スタートへ戻す'; small = `覚える ${learnK + 1} / ${learnSeq.length}`; }
  else if (state === 'instruct') big = '目を閉じて';
  else if (state === 'reach') { big = '手を伸ばす'; small = '触れたらクリック'; }
  else if (state === 'answer') { big = 'ずれていた？'; small = '左クリック：はい　右クリック：いいえ'; }
  B.textContent = big; S.textContent = small; B.hidden = !big; S.hidden = !small;
  if (busy()) $('res').hidden = true;
  $('side').classList.toggle('off', busy());
  draw();
}

function resize() { const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
window.addEventListener('resize', resize);
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (['instruct', 'reach', 'answer'].includes(state)) return;
  const ox = W / 2, oy = H - 30;
  const sc = Math.max(10, Math.min((H - 120) / 1.12, (W - 40) / 2.1)), pt = p => [ox + p.x * sc, oy - p.y * sc];
  ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(r => { ctx.beginPath(); ctx.arc(ox, oy, r * sc, Math.PI, 2 * Math.PI); ctx.stroke(); });
  dotAt(ox, oy, '#111827', 6, 'スタート');
  const sp = nextSpec();
  const ang = busy() ? learnAng : (state === 'result' || state === 'done') && last ? last.ang : sp ? sp.ang : set.mAng;
  const g = geom(ang), r0 = Math.max(8, touchR(ang) * sc);
  const learning = state === 'learnGo' || state === 'learnBack';
  if (!learning) { const [x, y] = pt(g.P); ctx.fillStyle = '#10b981'; ctx.fillRect(x - 7, y - 7, 14, 14); ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.fillText('本物', x, y + 22); }
  ['A', 'M', 'B'].forEach(id => { const cur = state === 'learnGo' && learnSeq[learnK] === id, [x, y] = pt(g[id]);
    ctx.beginPath(); ctx.arc(x, y, cur ? r0 + 4 : r0, 0, 7); if (cur) { ctx.fillStyle = TOOLS[id].color + '55'; ctx.fill(); }
    ctx.lineWidth = 3; ctx.strokeStyle = TOOLS[id].color; ctx.stroke();
    ctx.fillStyle = TOOLS[id].color; ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(TOOLS[id].name, x, y - r0 - 8); });
  // マウスの位置：本物でクリックしたあとは「本物からどれだけ動いたか」を前回の物差しで表示
  let me = null;
  if (frame) me = hand;
  else if (state === 'calS' && rawP) { const len = store.get('ar5.len', null); if (len) me = { x: (raw.x - rawP.x) / len, y: 1 + (raw.y - rawP.y) / len }; }
  if (me) { const [x, y] = pt(me); dotAt(x, y, '#2563eb', 7); }
  if ((state === 'result' || state === 'done') && last) {
    const line = (pts, color, w, dash) => { if (pts.length < 2) return; ctx.setLineDash(dash || []); ctx.lineWidth = w; ctx.strokeStyle = color; ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = pt(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.setLineDash([]); };
    line(last.src, '#a855f7', 3, [6, 4]); line(last.path, '#111827', 2.5);
    const [x, y] = pt(last.E); dotAt(x, y, '#111827', 6);
  }
}
function dotAt(x, y, color, r, label) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = color; ctx.fill(); if (label) { ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.fillText(label, x, y + r + 14); } }

sync(); resize(); render();
})();
</script>
</body>
</html>
