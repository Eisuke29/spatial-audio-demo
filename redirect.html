<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聴覚リダイレクション デモ</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--p:#10b981;
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;display:flex;flex-direction:column}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 8px 0 0}
.sp{flex:1}
.muted{color:var(--muted);font-size:12px}
.btn{border:0;border-radius:8px;padding:5px 10px;font:inherit;font-weight:700;cursor:pointer;background:#eef2ff;color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff}
.seg{display:flex;background:#f1f5f9;border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 10px;font:inherit;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0002}
.app{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 330px;gap:10px;padding:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.col.off{opacity:.4;pointer-events:none}
.card{background:var(--card);border-radius:12px;padding:10px;box-shadow:0 1px 2px #0000000d}
.lbl{font-size:12px;font-weight:700;margin:0 0 6px}
table.ctab{width:100%;border-collapse:separate;border-spacing:3px}
.ctab th{font-weight:600;color:var(--muted);text-align:left;font-size:11px}
.ctab thead th{text-align:center}
.ctab td{padding:0}
.ctab button{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 0;font:inherit;font-size:15px;cursor:pointer}
.ctab button[aria-pressed=true]{border-color:var(--accent);background:#eef2ff;color:#3730a3;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 9px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.prog{height:6px;background:#eef2ff;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stage{position:relative;padding:0;overflow:hidden;min-height:0;display:flex;flex-direction:column}
.steps{display:flex;gap:5px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:center;flex:none}
.steps span{font-size:12px;padding:2px 9px;border-radius:99px;background:#f1f5f9;color:#9ca3af}
.steps span.now{background:var(--accent);color:#fff;font-weight:700}
.steps .info{margin-left:auto;background:none;color:var(--muted);padding:0}
#map{display:block;width:100%;flex:1;min-height:0;background:#fff}
.banner{position:absolute;left:0;right:0;top:36px;bottom:0;display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:2px;pointer-events:none;text-align:center}
.banner big{font-size:clamp(18px,2.1vw,25px);font-weight:800;background:#ffffffe6;padding:0 12px;border-radius:10px}
.banner small{font-size:13px;color:var(--muted);background:#ffffffe6;padding:0 10px;border-radius:8px}
.banner.dark{background:#0b0d12;justify-content:center;padding-top:0}
.banner.dark big{background:none;color:#e5e7eb}.banner.dark small{background:none;color:#9ca3af}
.res{position:absolute;left:10px;bottom:10px;background:#fffffff2;border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 4px 16px #0001;max-width:340px}
.res .big{font-size:28px;font-weight:800;line-height:1.1}
.res .big small{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.res p{margin:4px 0 0}
#cam{display:block;width:100%;background:#111;border-radius:8px;cursor:crosshair}
.setup{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:3px}
.setup li{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 6px;border-radius:7px;color:var(--muted)}
.setup li.now{background:#eef2ff;color:#3730a3;font-weight:700}
.setup li.ok{color:#166534}
.setup li .redo{margin-left:auto;border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;font-size:11px}
select{font:inherit;font-size:12px;max-width:100%}
dialog{border:0;border-radius:14px;padding:16px;max-width:min(900px,95vw);box-shadow:0 20px 60px #0003}
dialog::backdrop{background:#0006}
table.heat{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:600;color:var(--muted);text-align:center;padding:2px 6px}
.heat th:first-child{text-align:left;white-space:nowrap}
.heat td{text-align:center;border-radius:6px;padding:4px 8px;min-width:60px}
.heat td b{display:block;font-size:13px}
.heat td span{font-size:10px;opacity:.85}
</style>
</head>
<body>
<header>
  <h1>🎧 聴覚リダイレクション</h1>
  <div class="seg" id="mode"><button data-v="auto">自動</button><button data-v="manual">手動</button></div>
  <span class="sp"></span>
  <button class="btn" id="pause">⏸ 一時停止</button>
  <button class="btn" id="tl">◀ 左</button><button class="btn" id="tr">右 ▶</button>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.6" style="width:70px" title="音量">
  <button class="btn" id="sumBtn">まとめ</button>
  <button class="btn" id="relearn">覚え直す</button>
</header>

<div class="app">
  <aside class="col" id="left">
    <div class="card">
      <div class="lbl" id="condLbl">音の条件</div>
      <table class="ctab">
        <thead><tr><th></th><th>鳴りっぱなし</th><th>バックセンサー</th></tr></thead>
        <tbody id="ctab"></tbody>
      </table>
      <div class="muted" id="condName" style="min-height:1.5em"></div>
    </div>
    <div class="card">
      <div class="lbl" id="angLbl">道具の間隔</div>
      <div class="chips" id="angChips"></div>
    </div>
    <div class="card" id="manualBox">
      <div class="lbl">取る道具</div>
      <div class="seg" id="toolSeg"><button data-v="A">赤 前</button><button data-v="M">青</button><button data-v="B">黄 後</button><button data-v="rand">🎲</button></div>
    </div>
    <div class="card" id="autoBox">
      <div class="row"><span class="lbl" style="margin:0">進み具合</span><button class="btn" id="restart">最初から</button></div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="muted" id="progTxt"></div>
    </div>
  </aside>

  <section class="card stage">
    <div class="steps" id="steps"><span>覚える</span><span>声</span><span>伸ばす</span><span>答える</span><span class="info" id="trialInfo"></span></div>
    <canvas id="map"></canvas>
    <div class="banner" id="banner"><big id="bBig"></big><small id="bSmall"></small></div>
    <div class="res" id="res" hidden>
      <div class="big" id="rBig"></div>
      <p id="rTxt"></p>
      <div id="finalBox" hidden style="margin-top:6px"><b>本物はいくつあった？</b>
        <button class="btn" data-real="1">1</button><button class="btn" data-real="2">2</button><button class="btn" data-real="3">3</button> <span class="muted" id="realAns"></span></div>
    </div>
  </section>

  <aside class="col">
    <div class="card">
      <div class="row" style="margin-bottom:6px"><span class="lbl" style="margin:0">カメラ（机の真上から）</span><button class="btn" id="camStart">カメラを使う</button></div>
      <select id="camSel" hidden></select>
      <canvas id="cam" width="640" height="480"></canvas>
      <div class="row" style="margin-top:6px"><span class="muted">色の幅</span><input type="range" id="tol" min="6" max="40" value="16" style="width:120px"><span class="muted" id="trackSt"></span></div>
      <ol class="setup" id="setup"></ol>
    </div>
  </aside>
</div>

<dialog id="sumDlg">
  <div class="row" style="margin-bottom:8px"><b>まとめ（本物Pへ引っぱられた割合）</b><span><button class="btn" id="clearAll">消す</button> <button class="btn pri" id="sumClose">閉じる</button></span></div>
  <table class="heat" id="heat"></table>
  <p class="muted" style="margin:8px 0 0">0%＝覚えた道具の場所、100%＝本物P。小さい数字＝「ずれていた」／回答数。青（本物と同じ場所）は本物からのずれ（cm）。</p>
</dialog>

<script>
(() => {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ===== 道具と条件 =====
// 机の座標（cm）：A4の紙の手前左の角が原点、x＝右、y＝奥（前）。紙は机の手前のふちと平行に置く。
// 道具：頭を中心に、本物Pと同じ距離の弧の上。A（赤）＝Pより前、M（青）＝P、B（黄）＝Pより後ろ。
const TOOLS = { A: { name: '赤', side: -1, color: '#ef4444', pos: '前' }, M: { name: '青', side: 0, color: '#2563eb', pos: '本物の位置' }, B: { name: '黄', side: 1, color: '#d97706', pos: '後ろ' } };
const CONDS = [
  { id: 'none', loc: null, type: null, name: '音なし', mark: '−' },
  { id: 'T-c', loc: 'T', type: 'c', name: '道具の場所 × 鳴りっぱなし', mark: '○' },
  { id: 'T-s', loc: 'T', type: 's', name: '道具の場所 × バックセンサー', mark: '×' },
  { id: 'P-c', loc: 'P', type: 'c', name: '本物の場所 × 鳴りっぱなし', mark: '△' },
  { id: 'P-s', loc: 'P', type: 's', name: '本物の場所 × バックセンサー', mark: '◎' },
  { id: 'W-c', loc: 'W', type: 'c', name: 'ワーピング × 鳴りっぱなし', mark: '◎' },
  { id: 'W-s', loc: 'W', type: 's', name: 'ワーピング × バックセンサー', mark: '○' },
];
const CMAP = Object.fromEntries(CONDS.map(c => [c.id, c]));
const ANGLES = [5, 10, 15, 20, 30, 40];
const PAPER = { w: 29.7, h: 21.0 };          // A4 横置き
const HEAD_BEHIND = 15, EAR_ABOVE = 35;       // 頭は「体の真ん中」の15cm後ろ・机から35cm上と仮定

let set = Object.assign({ mode: 'auto', conds: CONDS.map(c => c.id), angles: [10, 20, 30], mCond: 'W-c', mAng: 20, mTool: 'rand' }, store.get('cam1.set', {}));
let su = Object.assign({ cam: null, corners: [], color: null, tol: 16, body: null, S: null, P: null }, store.get('cam1.setup', {}));
let learned = store.get('cam1.learned', null);
let plan = store.get('cam1.plan', null);
let history = store.get('cam1.history', []);
function save() { store.set('cam1.set', set); store.set('cam1.setup', su); store.set('cam1.learned', learned); store.set('cam1.plan', plan); store.set('cam1.history', history); }

// ===== 左パネル =====
const ctab = $('ctab');
[['道具', 'T'], ['本物', 'P'], ['ワーピング', 'W']].forEach(([lab, loc]) => {
  const tr = document.createElement('tr'); tr.innerHTML = `<th>${lab}</th>`;
  ['c', 's'].forEach(type => { const c = CONDS.find(x => x.loc === loc && x.type === type); tr.insertAdjacentHTML('beforeend', `<td><button data-c="${c.id}" title="${c.name}">${c.mark}</button></td>`); });
  ctab.appendChild(tr);
});
ctab.insertAdjacentHTML('beforeend', `<tr><th>音なし</th><td colspan="2"><button data-c="none" title="音なし">−</button></td></tr>`);
ctab.querySelectorAll('button').forEach(b => {
  b.onmouseenter = () => { $('condName').textContent = CMAP[b.dataset.c].name; };
  b.onmouseleave = () => { $('condName').textContent = ''; };
  b.onclick = () => { if (busy()) return; const id = b.dataset.c;
    if (set.mode === 'manual') set.mCond = id;
    else { const s = new Set(set.conds); s.has(id) ? s.delete(id) : s.add(id); if (!s.size) return; set.conds = CONDS.map(c => c.id).filter(x => s.has(x)); plan = null; }
    save(); sync(); };
});
ANGLES.forEach(a => { const b = document.createElement('button'); b.className = 'chip'; b.dataset.a = a; b.textContent = a + '°';
  b.onclick = () => { if (busy()) return;
    if (set.mode === 'manual') set.mAng = a;
    else { const s = new Set(set.angles); s.has(a) ? s.delete(a) : s.add(a); if (!s.size) return; set.angles = ANGLES.filter(x => s.has(x)); plan = null; }
    save(); sync(); };
  $('angChips').appendChild(b); });
$('mode').querySelectorAll('button').forEach(b => b.onclick = () => { if (busy()) return; set.mode = b.dataset.v; save(); sync(); });
$('toolSeg').querySelectorAll('button').forEach(b => b.onclick = () => { if (busy()) return; set.mTool = b.dataset.v; save(); sync(); });
$('restart').onclick = () => { if (busy()) return; plan = null; save(); sync(); };
$('relearn').onclick = () => { if (busy()) return; learned = null; save(); };
$('vol').oninput = () => { if (master) master.gain.value = Number($('vol').value); };
$('sumBtn').onclick = () => { renderHeat(); $('sumDlg').showModal(); };
$('sumClose').onclick = () => $('sumDlg').close();
$('clearAll').onclick = () => { if (confirm('結果を消しますか？')) { history = []; save(); renderHeat(); } };
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ 再開' : '⏸ 一時停止'; };
document.querySelectorAll('[data-real]').forEach(b => b.onclick = () => { if (plan) { plan.real = Number(b.dataset.real); save(); $('realAns').textContent = '→ 本当は1つ'; } });

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makePlan() { return { blocks: shuffle([...set.angles]).map(ang => ({ ang, trials: shuffle(set.conds.flatMap(cond => ['A', 'M', 'B'].map(tool => ({ cond, tool })))) })), b: 0, i: 0, real: null }; }
const planDone = () => plan && plan.b >= plan.blocks.length;
function planCount() { let d = 0, n = 0; plan.blocks.forEach((bl, k) => { n += bl.trials.length; if (k < plan.b) d += bl.trials.length; else if (k === plan.b) d += plan.i; }); return [d, n]; }
function nextSpec() {
  if (set.mode === 'manual') return { ang: set.mAng, cond: set.mCond, tool: set.mTool };
  if (!plan) plan = makePlan();
  if (planDone()) return null;
  const bl = plan.blocks[plan.b]; return { ang: bl.ang, ...bl.trials[plan.i] };
}
function sync() {
  const auto = set.mode === 'auto';
  $('mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === set.mode)));
  $('autoBox').hidden = !auto; $('manualBox').hidden = auto;
  $('condLbl').textContent = auto ? '音の条件（使うもの全部）' : '音の条件（1つ）';
  $('angLbl').textContent = auto ? '道具の間隔（使うもの全部）' : '道具の間隔（1つ）';
  ctab.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(auto ? set.conds.includes(b.dataset.c) : set.mCond === b.dataset.c)));
  $('angChips').querySelectorAll('.chip').forEach(b => { const a = Number(b.dataset.a); b.setAttribute('aria-pressed', String(auto ? set.angles.includes(a) : set.mAng === a)); });
  $('toolSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === set.mTool)));
  if (auto && !plan) { plan = makePlan(); save(); }
  if (plan) { const [d, n] = planCount(); $('progBar').style.width = (d / n * 100) + '%'; $('progTxt').textContent = planDone() ? `${n}回 終了` : `${d} / ${n}回（間隔 ${plan.blocks[plan.b].ang}°）`; }
  $('left').classList.toggle('off', busy());
}

// ===== 音 =====
let ac = null, master = null, panner = null, burst = null;
function ensureAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = Number($('vol').value); master.connect(ac.destination);
  panner = ac.createPanner(); panner.panningModel = 'HRTF'; panner.distanceModel = 'inverse'; panner.refDistance = 0.3; panner.rolloffFactor = 1;
  panner.connect(master);
  const l = ac.listener;
  if (l.forwardX) { l.forwardX.value = 0; l.forwardY.value = 0; l.forwardZ.value = -1; l.upX.value = 0; l.upY.value = 1; l.upZ.value = 0; } else l.setOrientation(0, 0, -1, 0, 1, 0);
  const sr = ac.sampleRate, n = Math.floor(sr * 0.15), f = Math.floor(sr * 0.005);
  burst = ac.createBuffer(1, n, sr); const d = burst.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, i / f, (n - 1 - i) / f) * 0.5;
}
document.addEventListener('pointerdown', ensureAudio, { once: true });
const head = () => ({ x: su.body.x, y: su.body.y - HEAD_BEHIND });
function setSource(p) { // 机の点 p（cm）→ 頭から見た位置（m）。頭は正面（机の奥）を向いている
  const h = head(), x = (p.x - h.x) / 100, y = -EAR_ABOVE / 100, z = -(p.y - h.y) / 100, t = ac.currentTime;
  if (panner.positionX) { panner.positionX.setTargetAtTime(x, t, 0.01); panner.positionY.setTargetAtTime(y, t, 0.01); panner.positionZ.setTargetAtTime(z, t, 0.01); }
  else panner.setPosition(x, y, z);
}
function pulse(t, gain, dest) { const s = ac.createBufferSource(); s.buffer = burst; const g = ac.createGain(); g.gain.value = gain; s.connect(g); g.connect(dest); s.start(t); }
function beep() { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.frequency.value = 1000;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.12); }
function testSide(s) { ensureAudio(); const p = ac.createStereoPanner(); p.pan.value = s; p.connect(master); for (let i = 0; i < 3; i++) pulse(ac.currentTime + i * 0.25, 0.8, p); }
$('tl').onclick = () => testSide(-1); $('tr').onclick = () => testSide(1);
function speak(text, done) {
  let fired = false; const go = () => { if (!fired) { fired = true; done(); } };
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 1.1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja')); if (v) u.voice = v;
    u.onend = go; u.onerror = go; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
  setTimeout(go, 2500);
}
let schedTimer = null, nextT = 0;
function startLoop() {
  stopLoop(); nextT = ac.currentTime + 0.03;
  const tick = () => { const st = soundNow(); if (!st) return; setSource(st.pos);
    while (nextT < ac.currentTime + 0.08) { pulse(nextT, st.gain, panner); nextT += st.interval; }
    schedTimer = setTimeout(tick, 20); };
  tick();
}
function stopLoop() { clearTimeout(schedTimer); schedTimer = null; }
// 手の進み具合：スタートS→本物P の線上で、どこまで来たか（S=0、P=1）
const progress = h => { const dx = su.P.x - su.S.x, dy = su.P.y - su.S.y; return ((h.x - su.S.x) * dx + (h.y - su.S.y) * dy) / (dx * dx + dy * dy); };
function srcPos() {
  const c = CMAP[trial.cond], { T, P } = trial;
  if (c.loc === 'T') return T;
  if (c.loc === 'P') return P;
  if (c.loc === 'W') { const q = clamp(progress(hand), 0, 1), s = q * q * (3 - 2 * q); return { x: T.x + (P.x - T.x) * s, y: T.y + (P.y - T.y) * s }; }
  return null;
}
function soundNow() {
  if (!trial || state !== 'reach') return null;
  const c = CMAP[trial.cond]; if (!c.loc) return null;
  const pos = srcPos();
  if (c.type === 'c') return { pos, interval: 0.35, gain: 0.8 };
  const k = clamp(1 - dist(hand, pos) / 30, 0, 1); // 30cm以内で変化
  return { pos, interval: 0.6 - 0.5 * k, gain: 0.3 + 0.7 * k };
}

// ===== カメラと手の追跡 =====
// 手（指先か手の甲）に、はっきりした色のシールを貼る。その色の重心を追う。
// 紙の4隅のクリックから、画像の点 → 机のcm への変換（射影変換）を作る。
const camCv = $('cam'), cctx = camCv.getContext('2d', { willReadFrequently: true });
const video = document.createElement('video'); video.muted = true; video.playsInline = true;
const proc = document.createElement('canvas'), pctx = proc.getContext('2d', { willReadFrequently: true });
let stream = null, Hm = null, Hinv = null, marker = null, hand = null, lost = 0;
async function startCam(id) {
  try {

}
function drawCam() {
  const W = camCv.width, H = camCv.height, g = cctx;
  if (!stream || video.readyState < 2) { g.fillStyle = '#111'; g.fillRect(0, 0, W, H); g.fillStyle = '#9ca3af'; g.font = '14px system-ui'; g.textAlign = 'center'; g.fillText('「カメラを使う」を押す', W / 2, H / 2); return; }
  g.drawImage(video, 0, 0, W, H);
  const P = p => [p.x * W, p.y * H];
  g.lineWidth = 2; g.strokeStyle = '#facc15'; g.fillStyle = '#facc15';
  if (su.corners.length) { g.beginPath(); su.corners.forEach((c, i) => { const [x, y] = P(c); i ? g.lineTo(x, y) : g.moveTo(x, y); }); if (su.corners.length === 4) g.closePath(); g.stroke();
    su.corners.forEach((c, i) => { const [x, y] = P(c); g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill(); g.font = '700 12px system-ui'; g.fillText(i + 1, x + 7, y - 7); }); }
  if (Hinv) { // 机の上の点を、映像の上にも重ねて確認できるように
    const mark = (p, color, label) => { const [x, y] = P(applyH(Hinv, p)); g.strokeStyle = color; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 8, 0, 7); g.stroke(); g.fillStyle = color; g.font = '700 12px system-ui'; g.fillText(label, x + 10, y + 4); };
    if (su.body) mark(su.body, '#e5e7eb', '体'); if (su.S) mark(su.S, '#e5e7eb', 'S');
    if (su.P && su.body) { const gm = geom(busy() ? learnAng : set.mode === 'manual' ? set.mAng : (nextSpec() || { ang: 20 }).ang); ['A', 'M', 'B'].forEach(id => mark(gm[id], TOOLS[id].color, TOOLS[id].name)); mark(su.P, '#10b981', '本物'); }
  }
  if (marker) { const [x, y] = P(marker); g.strokeStyle = '#22d3ee'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 12, y); g.lineTo(x + 12, y); g.moveTo(x, y - 12); g.lineTo(x, y + 12); g.stroke(); }
}

let prevState = '', prevStep = undefined;
function loop(t) {
  if (stream && video.readyState >= 2 && su.color) {
    const m = findMarker();
    if (m) { marker = marker ? { x: marker.x * 0.4 + m.x * 0.6, y: marker.y * 0.4 + m.y * 0.6 } : m; lost = 0; }
    else if (++lost > 10) marker = null;
    hand = marker && Hm ? applyH(Hm, marker) : null;
    $('trackSt').textContent = marker ? '● 追跡中' : '○ 見えない';
  }
  if (DEBUG && dbgHand) hand = { ...dbgHand };
  if (hand) updateStill(t);
  tick(t);
  if (state !== prevState) { prevState = state; render(); sync(); }
  const stp = setupStep(); if (stp !== prevStep) { prevStep = stp; renderSetup(); render(); }
  drawCam(); drawMap();
  requestAnimationFrame(loop);
}

buildH(); sync(); resize(); renderSetup(); render(); requestAnimationFrame(loop);
if (su.cam) navigator.mediaDevices?.enumerateDevices().then(d => { if (d.some(x => x.kind === 'videoinput' && x.label)) startCam(su.cam); });
setInterval(render, 500);
})();
</script>
